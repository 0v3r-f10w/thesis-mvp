#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEDZ2Ifq2UR76VWOj8COo3x7lfFSfZgY6OFwlVgzu2vT qemu-vm
package_update: true
packages:
  - docker-compose
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - echo 'flag{qemu_vm_host_flag}' > /flag.txt
  - chmod 644 /flag.txt